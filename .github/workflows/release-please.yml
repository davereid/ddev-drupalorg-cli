# Opens and updates a release pull request from conventional commits (feat:,
# fix:) pushed to main. Merging it tags the version and publishes a GitHub
# release, which `ddev add-on get` installs.
name: release-please

on:
  push:
    branches: [ main, '*.x' ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tags
    runs-on: ubuntu-latest
    environment: release # Holds the App's private key, for main and *.x only.
    # Only used without the App (no RELEASE_APP_CLIENT_ID variable): GITHUB_TOKEN
    # then opens the release PR, and its checks wait for approval.
    permissions:
      contents: write # Create release tags and GitHub releases.
      issues: write # Add labels to the release PR.
      pull-requests: write # Open and update the release PR.
    steps:
      # A GitHub App token, not GITHUB_TOKEN, so release PR checks start without approval (#4).
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # Create release tags and GitHub releases.
          permission-pull-requests: write # Open and update the release PR, and its labels.

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          release-type: simple
          target-branch: ${{ github.ref_name }}
